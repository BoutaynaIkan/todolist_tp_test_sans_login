name: CI pour le projet React

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lancer les tests et le linting
    runs-on: ubuntu-latest
    # ajoutée pour définir le répertoire de travail par défaut pour toutes les étapes de ce job
    defaults:
      run:
        working-directory: mon-exam-frontend
    strategy:
      matrix:
        node-version: [20.x, 22.x] # Modifiée : On peut tester sur plusieurs versions de Node

    steps:
      - name: 1. Checkout du code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 3. Cache des dépendances npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 4. Installation des dépendances
        run: npm ci
      # Ajoutée
      #- name: 5. Exécution du Linter avec eslint
      #  run: npm run lint

      - name: 6. Exécution des tests
        run: npm test