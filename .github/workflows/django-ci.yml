name: CI pour le projet Django

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lancer les tests unitaires
    runs-on: ubuntu-latest
    # ajoutée pour définir le répertoire de travail par défaut pour toutes les étapes de ce job
    defaults:
      run:
        working-directory: mon_exam_backend
    strategy:
      matrix:
        python-version: ["3.14"] # Modifiée : On peut tester sur plusieurs versions ici

    steps:
      - name: 1. Checkout du code
        uses: actions/checkout@v4

      - name: 2. Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 3. Cache des dépendances pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 4. Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
    # Ajoutée pour exécuter le linter avant les tests afin de vérifier la qualité du code
      - name: 5. Exécution du Linter avec flake8
        run: |
          flake8 .

      - name: 6. Exécution des tests
        run: |
          pytest 
